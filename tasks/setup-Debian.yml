---
- name: setup-Debian | Ensure dependencies are present.
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg2
    state: present

- name: setup-Debian | Create apt keyrings directory.
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: setup-Debian | Create temporary directory for the Nodesource GPG key.
  ansible.builtin.tempfile:
    state: directory
    prefix: nodesource-key-
  register: nodejs_key_dir
  changed_when: false

# The key is fetched into a private temporary directory and only installed when
# it holds exactly one key and the fingerprint of that key is the one NodeSource
# signs its repository with. It is installed (dearmored) to the path earlier
# versions of this role used, so existing installs are updated in place.
- name: setup-Debian | Verify and install Nodesource GPG key.
  vars:
    nodejs_apt_key_fingerprint: 6F71F525282841EEDAF851B42F59B5F99B1BE0B4
  block:
    - name: setup-Debian | Download Nodesource GPG key.
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: "{{ nodejs_key_dir.path }}/key.asc"
        mode: "0600"
      changed_when: false
      register: nodejs_key_download
      until: nodejs_key_download is succeeded

    - name: setup-Debian | Read Nodesource GPG key fingerprints.
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - --with-fingerprint
          - "{{ nodejs_key_dir.path }}/key.asc"
      environment:
        GNUPGHOME: "{{ nodejs_key_dir.path }}"
      changed_when: false
      register: nodejs_key_info

    # In the colon listing the first fpr line is the fingerprint of the
    # primary key, the ones after it belong to subkeys.
    - name: setup-Debian | Verify Nodesource GPG key fingerprint.
      ansible.builtin.assert:
        that:
          - nodejs_key_info.stdout_lines | select('match', '^(pub|sec):') | list | length == 1
          - (nodejs_key_info.stdout_lines | select('match', '^fpr:') | first).split(':')[9] | upper == nodejs_apt_key_fingerprint
        fail_msg: >-
          The key downloaded from https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
          is not a single key with fingerprint {{ nodejs_apt_key_fingerprint }}, refusing to trust it.
        quiet: true

    - name: setup-Debian | Dearmor Nodesource GPG key.
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --dearmor
          - -o
          - "{{ nodejs_key_dir.path }}/key.gpg"
          - "{{ nodejs_key_dir.path }}/key.asc"
      environment:
        GNUPGHOME: "{{ nodejs_key_dir.path }}"
      changed_when: false

    - name: setup-Debian | Install Nodesource GPG key.
      ansible.builtin.copy:
        src: "{{ nodejs_key_dir.path }}/key.gpg"
        dest: /etc/apt/keyrings/nodesource.gpg
        remote_src: true
        owner: root
        group: root
        mode: "0644"
  always:
    - name: setup-Debian | Remove temporary directory for the Nodesource GPG key.
      ansible.builtin.file:
        path: "{{ nodejs_key_dir.path }}"
        state: absent
      changed_when: false

- name: setup-Debian | Ensure python3-debian is present.
  ansible.builtin.package:
    name: python3-debian
    state: present

# The one-line source below was written by earlier versions of this role.
# Remove it so upgrades don't leave duplicate sources.
- name: setup-Debian | Remove legacy NodeSource apt source.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent

- name: setup-Debian | Add NodeSource repository.
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_version }}"
    suites: nodistro
    components: main
    signed_by: /etc/apt/keyrings/nodesource.gpg
    state: present
  register: node_repo

- name: setup-Debian | Update apt cache if repo was added.
  ansible.builtin.apt:
    update_cache: true
  when: node_repo is changed
  tags: ["skip_ansible_lint"]

- name: setup-Debian | Pin apt to prefer NodeSource's nodejs over the distro package.
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    content: |
      Package: *
      Pin: origin deb.nodesource.com
      Pin-Priority: 600
    mode: "0644"

- name: setup-Debian | Ensure Node.js and npm are installed.
  ansible.builtin.apt:
    name: nodejs
    state: present
